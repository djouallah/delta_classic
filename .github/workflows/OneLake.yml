name: OneLake Integration Test (v2.0)

# delta_classic against a real Fabric lakehouse: test/onelake/onelake.sql, in SQL, with the DuckDB CLI and the
# linux_amd64 build of the distribution pipeline. It writes into a schema of its own (dc_ci_<run id>_<attempt>) and
# removes it afterwards.
#
# OIDC only, no client secret: azure/login exchanges the GitHub token for an Entra token. Setup, once:
#   - a federated credential on the app registration for repo:djouallah/delta_classic:ref:refs/heads/main
#   - repo secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, FABRIC_WORKSPACE_ID and FABRIC_LAKEHOUSE_ID (a lakehouse with
#     schemas), and the app a Contributor of that workspace

on:
  workflow_run:
    workflows: ["Main Extension Distribution Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      keep:
        description: Leave the test schema in the lakehouse, to look at it in Fabric.
        type: boolean
        default: false

# One lakehouse: queue, never cancel a run halfway through its writes
concurrency:
  group: onelake
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  onelake:
    name: OneLake
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUCKDB_VERSION: v2.0.1
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      SCHEMA: dc_ci_${{ github.run_id }}_${{ github.run_attempt }}
      # The azure extension's default transport fails the OneLake TLS handshake on Linux runners; curl works
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4

      - name: Download the extension of the run that triggered this one
        if: ${{ github.event_name == 'workflow_run' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_classic-${{ env.DUCKDB_VERSION }}-extension-linux_amd64
          run_id: ${{ github.event.workflow_run.id }}
          path: ./artifact

      - name: Download the extension of the latest successful build of main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_classic-${{ env.DUCKDB_VERSION }}-extension-linux_amd64
          workflow: MainDistributionPipeline.yml
          workflow_conclusion: success
          branch: main
          path: ./artifact

      - name: Install the DuckDB CLI
        run: |
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl -sSfL "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb-cli-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/duckdb"
          ls -l "$RUNNER_TEMP/duckdb"
          "$RUNNER_TEMP/duckdb/duckdb" -c "INSTALL delta; INSTALL azure; SELECT version();"

      - id: login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Run test/onelake/onelake.sql
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          cat > "$RUNNER_TEMP/prelude.sql" <<EOF
          SET azure_transport_option_type = 'curl';
          CREATE SECRET onelake (TYPE azure, PROVIDER access_token, ACCESS_TOKEN '$TOKEN');
          LOAD delta;
          LOAD './artifact/delta_classic.duckdb_extension';
          EOF
          export WS="abfss://${FABRIC_WORKSPACE_ID}@onelake.dfs.fabric.microsoft.com/"
          export LH="abfss://${FABRIC_WORKSPACE_ID}@onelake.dfs.fabric.microsoft.com/${FABRIC_LAKEHOUSE_ID}"
          export LH_ID="${FABRIC_LAKEHOUSE_ID}"
          export SCHEMA
          envsubst '${WS} ${LH} ${LH_ID} ${SCHEMA}' < test/onelake/onelake.sql > "$RUNNER_TEMP/onelake.sql"
          # The whole file runs; then the errors it raised must be exactly the expected ones, in order
          # (-f stops at the first error: read the file from stdin, after .bail off)
          { echo ".bail off"; cat "$RUNNER_TEMP/onelake.sql"; } \
            | "$RUNNER_TEMP/duckdb/duckdb" -unsigned -init "$RUNNER_TEMP/prelude.sql" -echo \
            2>&1 | tee "$RUNNER_TEMP/output.txt" || true
          grep '^-- expect-error: ' test/onelake/onelake.sql | sed 's/^-- expect-error: //' > "$RUNNER_TEMP/expected.txt"
          grep -E '^[A-Za-z ]+ Error: ' "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/errors.txt" || true
          echo "::group::Errors raised"; cat "$RUNNER_TEMP/errors.txt"; echo "::endgroup::"
          failed=0
          if [ "$(wc -l < "$RUNNER_TEMP/errors.txt")" != "$(wc -l < "$RUNNER_TEMP/expected.txt")" ]; then
            echo "::error::$(wc -l < "$RUNNER_TEMP/errors.txt") errors, $(wc -l < "$RUNNER_TEMP/expected.txt") expected"
            failed=1
          fi
          paste -d '\n' "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/errors.txt" | while read -r want && read -r got; do
            case "$got" in *"$want"*) ;; *) echo "::error::expected an error containing '$want', got: $got"; exit 1 ;; esac
          done || failed=1
          grep -q "all OneLake checks passed" "$RUNNER_TEMP/output.txt" || { echo "::error::the script did not finish"; failed=1; }
          exit $failed

      - name: Remove the test schema
        if: ${{ always() && !inputs.keep && steps.login.outcome == 'success' }}
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          curl -sS -X DELETE -o /dev/null -w "DELETE Tables/${SCHEMA}: HTTP %{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" -H "x-ms-version: 2023-11-03" \
            "https://onelake.dfs.fabric.microsoft.com/${FABRIC_WORKSPACE_ID}/${FABRIC_LAKEHOUSE_ID}/Tables/${SCHEMA}?recursive=true" || true
